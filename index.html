<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Inventario</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

h2{
    text-align:center;
}

input{
    padding:10px;
    margin:5px;
    width:220px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.entrada{
    background:#28a745;
    color:white;
}

.salida{
    background:#dc3545;
    color:white;
}

.exportar{
    background:#0078D7;
    color:white;
}

.eliminar{
    background:#555;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#0078D7;
    color:white;
}

tr:nth-child(even){
    background:#f5f5f5;
}

</style>
</head>

<body>

<h2>📦 Control de Inventario</h2>

<input type="text" id="codigo" placeholder="Código">

<input type="text" id="descripcion" placeholder="Descripción">

<input type="number" id="cantidad" placeholder="Cantidad">

<br>

<button class="entrada" onclick="entradaInventario()">
➕ Entrada
</button>

<button class="salida" onclick="salidaInventario()">
➖ Salida
</button>

<button class="exportar" onclick="exportarCSV()">
📊 Exportar Excel
</button>

<h3>Inventario Actual</h3>

<table>

<thead>
<tr>
<th>Código</th>
<th>Descripción</th>
<th>Cantidad</th>
<th>Última Entrada</th>
<th>Última Salida</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaInventario">
</tbody>

</table>

<script>

let inventario =
JSON.parse(localStorage.getItem("inventario")) || [];

mostrarInventario();

function entradaInventario(){

    let codigo =
    document.getElementById("codigo").value.trim();

    let descripcion =
    document.getElementById("descripcion").value.trim();

    let cantidad =
    parseInt(document.getElementById("cantidad").value);

    if(!codigo || !descripcion || isNaN(cantidad)){

        alert("Complete todos los campos");
        return;
    }

    let producto =
    inventario.find(
        p => p.codigo === codigo
    );

    if(producto){

        producto.cantidad += cantidad;

        producto.ultimaEntrada =
        new Date().toLocaleString();

    }
    else{

        inventario.push({
            codigo: codigo,
            descripcion: descripcion,
            cantidad: cantidad,
            ultimaEntrada: new Date().toLocaleString(),
            ultimaSalida: ""
        });
    }

    guardarDatos();
}

function salidaInventario(){

    let codigo =
    document.getElementById("codigo").value.trim();

    let cantidad =
    parseInt(document.getElementById("cantidad").value);

    if(!codigo || isNaN(cantidad)){

        alert("Ingrese código y cantidad");
        return;
    }

    let producto =
    inventario.find(
        p => p.codigo === codigo
    );

    if(!producto){

        alert("Producto no encontrado");
        return;
    }

    if(producto.cantidad < cantidad){

        alert("Existencia insuficiente");
        return;
    }

    producto.cantidad -= cantidad;

    producto.ultimaSalida =
    new Date().toLocaleString();

    guardarDatos();
}

function eliminarProducto(codigo){

    if(!confirm("¿Desea eliminar este producto?")){
        return;
    }

    inventario =
    inventario.filter(
        p => p.codigo !== codigo
    );

    guardarDatos();
}

function guardarDatos(){

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    limpiarCampos();

    mostrarInventario();
}

function limpiarCampos(){

    document.getElementById("codigo").value="";
    document.getElementById("descripcion").value="";
    document.getElementById("cantidad").value="";
}

function mostrarInventario(){

    let tabla =
    document.getElementById("tablaInventario");

    tabla.innerHTML = "";

    inventario.forEach(producto => {

        tabla.innerHTML += `
        <tr>
            <td>${producto.codigo}</td>
            <td>${producto.descripcion}</td>
            <td>${producto.cantidad}</td>
            <td>${producto.ultimaEntrada || "-"}</td>
            <td>${producto.ultimaSalida || "-"}</td>
            <td>
                <button
                class="eliminar"
                onclick="eliminarProducto('${producto.codigo}')">
                🗑 Eliminar
                </button>
            </td>
        </tr>
        `;
    });
}

function exportarCSV(){

    let csv =
    "Codigo,Descripcion,Cantidad,UltimaEntrada,UltimaSalida\n";

    inventario.forEach(producto => {

        csv +=
        `"${producto.codigo}","${producto.descripcion}","${producto.cantidad}","${producto.ultimaEntrada || ""}","${producto.ultimaSalida || ""}"\n`;

    });

    let blob =
    new Blob(
        [csv],
        {type:"text/csv;charset=utf-8;"}
    );

    let link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "Inventario.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}

</script>

</body>
</html>
