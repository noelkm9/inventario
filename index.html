<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h2{
    text-align:center;
}

input{
    padding:10px;
    margin:5px;
    width:200px;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

.entrada{
    background:green;
    color:white;
    border:none;
}

.salida{
    background:red;
    color:white;
    border:none;
}

.eliminar{
    background:#444;
    color:white;
    border:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:#0078D7;
    color:white;
}

</style>

</head>

<body>

<h2>📦 Control de Inventario</h2>

<input type="text" id="codigo" placeholder="Código">
<input type="text" id="descripcion" placeholder="Descripción">
<input type="number" id="cantidad" placeholder="Cantidad">

<br>

<button class="entrada" onclick="entradaInventario()">
➕ Entrada
</button>

<button class="salida" onclick="salidaInventario()">
➖ Salida
</button>

<h3>Inventario Actual</h3>

<table>

<thead>
<tr>
<th>Código</th>
<th>Descripción</th>
<th>Cantidad</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaInventario">
</tbody>

</table>

<script>

let inventario =
JSON.parse(localStorage.getItem("inventario")) || [];

mostrarInventario();

function entradaInventario(){

    let codigo =
    document.getElementById("codigo").value.trim();

    let descripcion =
    document.getElementById("descripcion").value.trim();

    let cantidad =
    parseInt(document.getElementById("cantidad").value);

    if(!codigo || !descripcion || !cantidad){

        alert("Complete todos los campos");
        return;
    }

    let producto =
    inventario.find(
        p => p.codigo === codigo
    );

    if(producto){

        producto.cantidad += cantidad;

    }else{

        inventario.push({
            codigo:codigo,
            descripcion:descripcion,
            cantidad:cantidad
        });
    }

    guardar();
}

function salidaInventario(){

    let codigo =
    document.getElementById("codigo").value.trim();

    let cantidad =
    parseInt(document.getElementById("cantidad").value);

    let producto =
    inventario.find(
        p => p.codigo === codigo
    );

    if(!producto){

        alert("Producto no encontrado");
        return;
    }

    if(producto.cantidad < cantidad){

        alert("Existencia insuficiente");
        return;
    }

    producto.cantidad -= cantidad;

    guardar();
}

function eliminarProducto(codigo){

    if(!confirm("¿Eliminar producto?")){
        return;
    }

    inventario =
    inventario.filter(
        p => p.codigo !== codigo
    );

    guardar();
}

function guardar(){

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    limpiar();

    mostrarInventario();
}

function limpiar(){

    document.getElementById("codigo").value="";
    document.getElementById("descripcion").value="";
    document.getElementById("cantidad").value="";
}

function mostrarInventario(){

    let tabla =
    document.getElementById("tablaInventario");

    tabla.innerHTML = "";

    inventario.forEach(producto => {

        tabla.innerHTML += `
        <tr>
            <td>${producto.codigo}</td>
            <td>${producto.descripcion}</td>
            <td>${producto.cantidad}</td>
            <td>
                <button
                class="eliminar"
                onclick="eliminarProducto('${producto.codigo}')">
                🗑 Eliminar
                </button>
            </td>
        </tr>
        `;
    });
}

</script>

</body>
</html>
