<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Inventario</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

input{
    padding:10px;
    margin:5px;
    width:220px;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#0078D7;
    color:white;
}
</style>

</head>
<body>

<h2>Control de Inventario</h2>

<input type="text" id="codigo" placeholder="Código">
<input type="text" id="descripcion" placeholder="Descripción">
<input type="number" id="cantidad" placeholder="Cantidad">

    <button onclick="entradaInventario()">
➕ Entrada
</button>

<button onclick="salidaInventario()">
➖ Salida
</button>

<h3>Inventario Actual</h3>

<table>
    <thead>
        <tr>
            <th>Código</th>
            <th>Descripción</th>
            <th>Cantidad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tablaInventario"></tbody>
</table>

<script>

let inventario =
JSON.parse(localStorage.getItem("inventario")) || [];

mostrarInventario();

function entradaInventario(){

    let codigo=document.getElementById("codigo").value;
    let descripcion=document.getElementById("descripcion").value;
    let cantidad=parseInt(document.getElementById("cantidad").value);

    if(!codigo || !descripcion || !cantidad){
        alert("Complete todos los los campos");
        return;
    }

    let producto= inventario.find(
        p=>p.codigo===codigo
    );

    if(producto){
        producto.cantidad += cantidad;
    }else{
        inventario.push({
            codigo:codigo,
            descripcion:descripcion,
            cantidad:cantidad
        });
    }

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    mostrarInventario();
}

function salidaInventario(){

    let codigo=document.getElementById("codigo").value;
    let cantidad=parseInt(document.getElementById("cantidad").value);

    let producto= inventario.find(
        p=>p.codigo===codigo
    );

    if(!producto){
        alert("Producto no encontrado");
        return;
    }

    if(producto.cantidad < cantidad){
        alert("No hay suficiente existencia");
        return;
    }

    producto.cantidad -= cantidad;

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    mostrarInventario();
}

    document.getElementById("codigo").value;

    let descripcion =
    document.getElementById("descripcion").value;

    let cantidad =
    parseInt(
        document.getElementById("cantidad").value
    );

    if(!codigo || !descripcion || !cantidad){
        alert("Complete todos los campos");
        return;
    }

    inventario.push({
        codigo,
        descripcion,
        cantidad
    });

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    mostrarInventario();

    document.getElementById("codigo").value="";
    document.getElementById("descripcion").value="";
    document.getElementById("cantidad").value="";
}

function mostrarInventario(){

    let tabla =
    document.getElementById("tablaInventario");

    tabla.innerHTML="";

    inventario.forEach(producto=>{

        tabla.innerHTML += `
        <tr>
            <td>${producto.codigo}</td>
            <td>${producto.descripcion}</td>
            <td>${producto.cantidad}</td>
            <td>
<button onclick="eliminarProducto('${producto.codigo}')">
🗑 Eliminar
</button>
</td>
</tr>
`;

function eliminarProducto(codigo){

    inventario =
    inventario.filter(
        p => p.codigo !== codigo
    );

    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );

    mostrarInventario();
}
        </tr>
        `;
    });
}

</script>

</body>
</html>
