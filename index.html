<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Compartido</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- LOGIN -->

    <div id="loginContainer" class="card">

        <h1>📦 Inventario Compartido</h1>

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico">

        <input
            type="password"
            id="password"
            placeholder="Contraseña">

        <button id="btnLogin">
            Ingresar
        </button>

    </div>

    <!-- APP -->

    <div id="appContainer" style="display:none;">

        <header>

            <h1>📦 Control de Inventario</h1>

            <div>

                <span id="usuarioActual"></span>

                <button id="btnLogout">
                    Cerrar sesión
                </button>

            </div>

        </header>

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="dashboardCard">
                <h3>Total Productos</h3>
                <p id="totalProductos">0</p>
            </div>

            <div class="dashboardCard">
                <h3>Total Piezas</h3>
                <p id="totalPiezas">0</p>
            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="card">

            <input
                type="text"
                id="codigo"
                placeholder="Código">

            <input
                type="text"
                id="descripcion"
                placeholder="Descripción">

            <input
                type="number"
                id="cantidad"
                placeholder="Cantidad">

            <button id="btnEntrada">
                ➕ Entrada
            </button>

            <button id="btnSalida">
                ➖ Salida
            </button>

            <button id="btnExportar">
                📊 Exportar CSV
            </button>

        </section>

        <!-- BUSCADOR -->

        <section class="card">

            <input
                type="text"
                id="buscar"
                placeholder="Buscar producto">

        </section>

        <!-- TABLA -->

        <section class="card">

            <table>

                <thead>

                    <tr>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>Último Movimiento</th>
                        <th>Usuario</th>
                    </tr>

                </thead>

                <tbody id="tablaInventario">

                </tbody>

            </table>

        </section>

        <!-- HISTORIAL -->

        <section class="card">

            <h2>Historial de Movimientos</h2>

            <table>

                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Cantidad</th>
                        <th>Usuario</th>
                    </tr>
                </thead>

                <tbody id="tablaHistorial">

                </tbody>

            </table>

        </section>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
